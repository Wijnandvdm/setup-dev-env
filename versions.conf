# shellcheck shell=bash
# shellcheck disable=SC2034  # every value here is read by install.sh, which
# sources this file; shellcheck cannot see across that boundary.
#
# Minimum versions for everything install.sh manages.
#
# This is the single place to bump versions: edit a value here and re-run
# ./install.sh <target>. Anything already at or above its minimum is left
# alone; anything below it gets upgraded.
#
# Values are minimums, not pins - a newer version is always fine.

# git
#
# 2.38 is a hard floor, not a preference. The settings in dotfiles/gitconfig
# need it: push.autoSetupRemote landed in 2.37 (and is silently ignored
# before that), merge.conflictStyle=zdiff3 in 2.35 (where an older git does
# not ignore it but aborts every merge), rebase.updateRefs and
# help.autocorrect=prompt in 2.38.
GIT_MIN=2.38

# uv - Python package/tool manager. 0.5 is where `uv tool` settled down.
UV_MIN=0.5.0

# pre-commit - installed as a uv tool.
PRE_COMMIT_MIN=4.0.0

# docker engine (the CLI/daemon, not Desktop).
DOCKER_MIN=24.0

# Note: the shellcheck hook version is pinned separately in
# .pre-commit-config.yaml, because pre-commit owns that file. Bump it with
# `pre-commit autoupdate` rather than by hand.
