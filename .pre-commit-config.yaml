# Run against everything:  pre-commit run --all-files
# Install the git hook:    pre-commit install
#
# shellcheck-py ships shellcheck as a Python wheel, so this needs no docker
# daemon (unlike koalaman/shellcheck-precommit) and works the same in CI.
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # -x lets shellcheck follow `source`d files (lib/, versions.conf)
        # instead of warning SC1091 that it cannot see them.
        args: [-x]
        # The hook defaults to types: [shell], which pre-commit decides from
        # the extension or shebang. dotfiles/shellrc and versions.conf have
        # neither - they are shell fragments meant to be sourced - so they
        # were being skipped silently. Match on path instead.
        types: [file]
        files: '(\.sh$|^dotfiles/shellrc$|^versions\.conf$)'
